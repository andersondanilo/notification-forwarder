[package]
name = "nf-server"
version.workspace = true
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bson = { version = "3.1.0", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures-util = "0.3.34"
if-addrs = "0.15.0"
rcgen = "0.14.10"
serde = { version = "1.0.229", features = ["derive"] }
time = "0.3.55"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal"] }
tokio-rustls = "0.26.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zbus = "5.19.0"
