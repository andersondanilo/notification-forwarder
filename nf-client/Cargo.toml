[package]
name = "nf-client"
version.workspace = true
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bson = { version = "3.1.0", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
notify-rust = "4.18.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal"] }
tokio-rustls = "0.26.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
